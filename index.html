<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#111815;--card:#19231f;--ink:#e4eee9;--muted:#98aaa1;--line:#2b3832;--acc:#178a5f;--acc2:#4cc38a;--warn:#e0705c;--chip:#24312b}

.btn.green,.pill.g,.tag.m{color:#0d1f17}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0 8px 0 0}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--muted);cursor:pointer;font:inherit;position:relative}
nav button.on{background:var(--chip);color:var(--ink);font-weight:600}
.badge{background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:4px}
#scanbox{flex:1;min-width:160px;max-width:280px}
#modebar{padding:8px 16px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--chip);font-size:13px}
.pill.a{background:var(--acc);color:#fff}.pill.g{background:var(--acc2);color:#fff}.pill.r{background:var(--warn);color:#fff}
main{padding:4px 16px 40px;max-width:1200px;margin:auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.card>b:first-child,.card h3{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat b{display:block;font-size:21px}.stat span{color:var(--muted);font-size:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:var(--chip)}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{width:100%;min-height:56px}
label{display:block;margin:6px 0;font-size:12.5px;color:var(--muted)}
label input,label select,label textarea{display:block;width:100%;margin-top:3px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;padding:7px 13px;border-radius:8px}
.btn.alt{background:var(--chip);color:var(--ink)}.btn.green{background:var(--acc2)}.btn.danger{background:var(--warn)}
.btn.big{font-size:18px;padding:12px 20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.muted{color:var(--muted)}.small{font-size:12px}
.weight{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.1}
.stable{color:var(--acc2)}.unstable{color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--chip);border:1px solid transparent;border-radius:99px;padding:4px 10px;font-size:13px;color:var(--ink)}
.chip.on{border-color:var(--acc);font-weight:600}
.alert{border-left:4px solid var(--warn);padding:7px 10px;background:var(--chip);border-radius:6px;margin:6px 0;font-size:13.5px}
.alert.ok{border-color:var(--acc2)}.alert.info{border-color:var(--acc)}
.tag{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.m{background:var(--acc2);color:#fff}
.bad{color:var(--warn);font-weight:600}.good{color:var(--acc2);font-weight:600}
.bigid{font-size:30px;font-weight:700;letter-spacing:.5px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(720px,96vw);max-height:92vh}
dialog::backdrop{background:#0006}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.labels{display:flex;flex-wrap:wrap;gap:8px}
.label{border:1px dashed var(--line);border-radius:6px;display:flex;gap:2mm;align-items:center;background:#fff;color:#000;overflow:hidden}
.label .qr{flex:none}.label b{font-size:14px;display:block;line-height:1.1}.label small{font-size:10px;display:block;line-height:1.2}
#printZone{display:none}
.lib{display:grid;grid-template-columns:300px 1fr;gap:12px;align-items:start}@media (max-width:820px){.lib{grid-template-columns:1fr}}
.lib .item{padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}.lib .item:hover{background:var(--chip)}.lib .item.on{background:var(--chip);border-color:var(--acc)}
.doc{line-height:1.6;font-size:15px}.doc h3{margin:16px 0 6px;font-size:19px}.doc h4{margin:14px 0 4px;font-size:16px}.doc ul,.doc ol{margin:6px 0;padding-left:24px}.doc p{margin:8px 0}
.lib textarea{min-height:52vh;font:14px/1.55 ui-monospace,Menlo,Consolas,monospace}
.tboard{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}@media (max-width:860px){.tboard{grid-template-columns:1fr}}
.tcol{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:12px;padding:10px}
.tcol.urgent{border-top-color:#e0705c}.tcol.important{border-top-color:#e8a23a}.tcol.todo{border-top-color:#4cc38a}
.tcol h3{margin:2px 2px 2px;font-size:16px}.tcol .sub{font-size:12px;color:var(--muted);margin:0 2px 8px}
.tcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:8px 0}
.tcard .tt{font-weight:600;cursor:pointer}.tcard .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
#login{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:24px 16px 80px}
#login .lbox{max-width:520px;margin:0 auto}#login .lhead img{margin:0 auto;height:44px!important}#login .lhead{background:#00694b;border-radius:14px;padding:18px;text-align:center;margin-bottom:16px}
#login input[type=password]{font-size:20px;padding:12px;width:100%;letter-spacing:.15em}
.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.kbd{display:inline-block;min-width:1.45em;padding:0 .35em;margin-right:.55em;border-radius:5px;background:rgba(255,255,255,.28);font-size:.72em;font-weight:700;line-height:1.55;vertical-align:.12em;text-align:center}
.btn.alt .kbd{background:rgba(255,255,255,.14)}
.btn.hk-flash{outline:3px solid var(--acc2);outline-offset:2px}
kbd{font:600 12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px}
#keybar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 8px #0001;padding:6px 16px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12.5px;color:var(--muted)}
#keybar .k{white-space:nowrap}#keybar .k kbd{margin-right:5px}#keybar .sep{width:1px;height:16px;background:var(--line)}
#keybar .x{margin-left:auto;cursor:pointer;background:none;border:0;color:var(--muted);font:inherit}
body.kb main{padding-bottom:70px}body.kb #toast{bottom:58px}
#keybarShow{position:fixed;right:12px;bottom:12px;z-index:6}
@media (pointer:coarse){.kbd,.hk-hint,#keybar,#keybarShow{display:none!important}body.kb main{padding-bottom:40px}body.kb #toast{bottom:18px}}
a{color:var(--acc)}
header{background:#00694b;border-bottom:0;color:#fff;box-shadow:0 1px 6px #0003}
header nav button{color:rgba(255,255,255,.78)}header nav button.on{background:rgba(255,255,255,.2);color:#fff}
header .chip{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}header .chip.on{border-color:#fff}
header .btn{background:#fff;color:#00694b;font-weight:600}header .btn.alt{background:rgba(255,255,255,.16);color:#fff;font-weight:500}
header #scanbox{background:#fff;color:#222;border-color:transparent}header #scanbox::placeholder{color:#6b6b6b}

<script>
/* ================= core ================= */
const STAGES=['Inoculated','Incubating','Fruiting','Between flushes','Closed'];
const REASONS=['Exhausted','Contaminated','Damaged','Removed to free space'];
const DAY=864e5,KEY='fungatory-db-v2',OLDKEY='eureka-grow-db';
const LEAD_DEFAULT={incub:21,first:7,between:12,y1:450,y2:250,y3:110,fail:10,spawnDays:14,cultureDays:14,spawnPer:250};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normId=s=>String(s).trim().toUpperCase().replace(/[^A-Z0-9._-]/g,'');
const hashStr=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dstr=t=>{if(t==null||t==='')return '';const d=new Date(t);if(isNaN(d))return '';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const pdate=s=>{if(!s)return null;const [y,m,d]=String(s).split('-').map(Number);if(!y)return null;return new Date(y,m-1,d||1).getTime()};
const fmtDate=t=>t?new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const fmtDay=t=>t?new Date(t).toLocaleDateString([], {month:'short',day:'numeric'}):'—';
const today0=()=>new Date().setHours(0,0,0,0);
const weekStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()-((d.getDay()+6)%7)*DAY};
const wkey=t=>dstr(weekStart(t));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sdev=a=>{if(a.length<2)return null;const m=avg(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const r1=x=>x==null||isNaN(x)?'—':(Math.round(x*10)/10).toString();
const pct=x=>x==null||isNaN(x)?'—':Math.round(x)+'%';
const sum=a=>a.reduce((x,y)=>x+y,0);

function blank(){return {v:2,settings:{unit:'lb',labelW:50,labelH:30,operators:['Trace'],op:'Trace',rooms:['Lab','Incubation','Fruiting'],nextBatch:1,bagIncluded:true,bagWeight:0,autoStart:true,autoHarvest:true,autoPrint:true,captureMin:200,rearm:30,stableTol:5,stableMs:1000,buffer:10,capInoc:100,horizon:12,useMeasured:true},
  strains:[],cultures:[],cultureJars:{},cycles:[],probe:{},spawn:[],spawnBags:{},recipes:[],batches:{},blocks:{},harvests:[],targets:{},lead:{},orders:[],tasks:[],purchases:[],snapshots:{},sensorReadings:[],log:[]}}
let db=load();db.log.forEach((l,i)=>{if(!l.id)l.id='l'+hashStr(l.t+'|'+l.msg+'|'+i)});
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.blocks){const b=blank();const out=Object.assign(b,d);out.settings=Object.assign(blank().settings,d.settings||{});return out}}catch(e){}
  try{const o=JSON.parse(localStorage.getItem(OLDKEY));if(o&&o.bags){const m=migrate(o);localStorage.setItem(KEY,JSON.stringify(m));return m}}catch(e){}
  return blank();
}
function migrate(o){
  const d=blank(),map={Inoculated:'Inoculated',Colonizing:'Incubating',Colonized:'Incubating',Fruiting:'Fruiting',Resting:'Between flushes',Spent:'Closed',Contaminated:'Closed'};
  if(o.settings&&o.settings.labelW){d.settings.labelW=o.settings.labelW;d.settings.labelH=o.settings.labelH}
  Object.values(o.bags||{}).forEach(b=>{
    const bid=normId('OLD-'+(b.batch||'X'));
    if(!d.batches[bid])d.batches[bid]={id:bid,species:b.species||'',strain:'',recipe:b.substrate||'',recipeVer:'',ingredients:'',spawnLot:'',inocRate:'',prepDate:'',sterilDate:'',inocDate:dstr(b.created),count:0,operator:'',dryWeight:b.dryWeight||null,notes:'Imported from first version',created:b.created};
    d.batches[bid].count++;
    const st=map[b.status]||'Incubating';
    d.blocks[b.id]={id:b.id,batchId:bid,stage:st,stageHist:(b.history||[]).map(h=>({stage:map[h.s]||h.s,t:h.t,op:''})),loc:[],startWeight:null,finalWeight:null,
      closure:st==='Closed'?{t:Date.now(),reason:b.status==='Contaminated'?'Contaminated':'Exhausted',op:'',notes:'Imported'}:null,flush:1,events:[],contam:b.status==='Contaminated'?[{t:Date.now(),note:'Imported',op:''}]:[],notes:b.notes||'',edits:[],labelPrints:1,created:b.created};
  });
  (o.harvests||[]).forEach(h=>{if(d.blocks[h.bagId])d.harvests.push({id:h.id,blockId:h.bagId,flush:h.flush||1,pick:1,grams:h.grams,t:h.t,op:'',notes:'',edits:[]})});
  Object.values(d.blocks).forEach(b=>{const hs=d.harvests.filter(h=>h.blockId===b.id).sort((a,c)=>a.t-c.t),c={};hs.forEach(h=>{c[h.flush]=(c[h.flush]||0)+1;h.pick=c[h.flush]});if(hs.length)b.flush=Math.max(...hs.map(h=>h.flush))});
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('⚠️ Could not save — export a backup now')}if(SYNC.on)queuePush()}

/* ================= shared sync with the server =================
   Data is split into records (one per block, harvest, batch…). Each device keeps a "shadow" of what the
   server last had, pushes only records it changed, and pulls other devices' changes every few seconds.
   Works offline: unsent changes stay in this browser and go up when the server is reachable again. */
const SYNC={on:false,ver:0,shadow:{},busy:false,again:false,t:null,key:'',state:'',first:false,dirty:false};
const S_MAPS=['batches','blocks','spawnBags','cultureJars','probe','targets','lead','snapshots'],S_LISTS=['harvests','tasks','orders','spawn','cultures','strains','recipes','log','cycles','purchases'];
function flatten(d){const r={};S_MAPS.forEach(c=>Object.entries(d[c]||{}).forEach(([k,v])=>{r[c+'/'+k]=v}));
  S_LISTS.forEach(c=>(d[c]||[]).forEach(v=>{if(v&&v.id!=null)r[c+'/'+v.id]=v}));
  const st=Object.assign({},d.settings);delete st.op;r['_/settings']=st;r['_/sensorReadings']=d.sensorReadings||[];return r}
function unflatten(r,op){const d=blank();d.settings=Object.assign(blank().settings,r['_/settings']||{});if(op)d.settings.op=op;
  if(r['_/sensorReadings'])d.sensorReadings=r['_/sensorReadings'];
  for(const [k,v] of Object.entries(r)){if(v==null||k.startsWith('_/'))continue;const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);
    if(S_MAPS.includes(c))d[c][id]=v;else if(S_LISTS.includes(c))d[c].push(v)}
  const byT=k=>(a,b)=>(a[k]||0)-(b[k]||0);d.harvests.sort(byT('t'));d.tasks.sort(byT('created'));d.strains.sort(byT('created'));d.log.sort(byT('t'));d.purchases.sort((a,b)=>String(a.date).localeCompare(String(b.date))||(a.created||0)-(b.created||0));
  d.spawn.sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  return d}

function setWeight(g,dev){const tol=+db.settings.stableTol||5;if(lastVal==null||Math.abs(g-lastVal)>tol){lastVal=g;lastChange=Date.now()}
  scale.raw=g;scale.lastT=Date.now();scale.dev=dev;evalStable()}
function evalStable(){if(scale.raw==null)return;const quiet=Date.now()-lastChange>=(+db.settings.stableMs||1000);
  scale.stable=scale.dev===false?false:scale.dev===true?true:quiet;updateWeight();autoCheck()}
setInterval(evalStable,250);
const fresh=()=>scale.raw!=null&&scale.label!=='Disconnected';
const net=()=>scale.raw==null||!fresh()?null:scale.raw-scale.tare;
function updateWeight(){document.querySelectorAll('.wlive').forEach(e=>e.textContent=W());const w=$('wt');if(!w)return;const g=net();w.textContent=g==null?'—':fmtW(g);w.className='weight '+(scale.stable?'stable':'unstable');
  $('wst').textContent=scale.raw==null?'':!fresh()?'⚠ scale disconnected':scale.stable?(armed?'● stable':'● stable — lift off to re-arm'):'○ settling…'}
function connLabel(l){scale.label=l;if(tab==='home'&&$('home').innerHTML)renderHome();else{const e=$('conn');if(e)e.textContent=l}}
/* Scale connects over USB HID (standard POS-scale report: status, unit, exponent, weight LSB/MSB).
   Once permission is granted, Chrome remembers it, so the scale reconnects by itself on load and when re-plugged. */
let hidDev=null;
function hex(dv){return [...new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength)].map(x=>x.toString(16).padStart(2,'0')).join(' ')}
async function attachHID(d){
  try{if(!d.opened)await d.open();hidDev=d;connLabel('Scale: '+(d.productName||'USB scale'));
    d.oninputreport=e=>{const v=e.data;scale.lastLine=`report ${e.reportId}: ${hex(v)}`;const ll=$('rawline');if(ll)ll.textContent='Last data: '+scale.lastLine;
      if(v.byteLength<5)return;const st=v.getUint8(0),unit=v.getUint8(1),exp=v.getInt8(2),raw=v.getUint16(3,true);
      let val=raw*Math.pow(10,exp);const u={2:'g',3:'kg',11:'oz',12:'lb'}[unit]||'g';if(st===5)val=-val;if(st===2)val=0;
      setWeight(val*UNITS[u],st===4||st===2?true:st===3?false:undefined)};
  }catch(e){toast('Scale: '+e.message)}
}
async function connectHID(){
  if(!('hid' in navigator))return toast('Connecting a scale needs Chrome or Edge on a computer (not inside the claude.ai viewer)');
  try{const [d]=await navigator.hid.requestDevice({filters:[]});if(d)await attachHID(d)}catch(e){toast('Scale: '+e.message)}
}
if('hid' in navigator){
  navigator.hid.getDevices().then(ds=>{if(ds[0])attachHID(ds[0])}).catch(()=>{});
  navigator.hid.addEventListener('connect',e=>{if(!hidDev||e.device===hidDev||!hidDev.opened){attachHID(e.device);toast('Scale reconnected')}});
  navigator.hid.addEventListener('disconnect',e=>{if(e.device===hidDev){hidDev=null;connLabel('Disconnected');toast('Scale unplugged')}});
}

function autoCheck(){
  const g=net();if(g==null)return;

  if(!can('harvest')){stableSince=0;return}
  if(!armed||!scale.stable||tab!=='home'||$('dlg').open){if(!scale.stable)stableSince=0;return}
  const m=mode.type,b=db.blocks[station.block],bt=db.batches[station.batch];
  if(m==='start'&&(!db.settings.autoStart||!bt||!nextStartTarget(bt)||g<(+db.settings.captureMin||0)))return;
  if(m==='harvest'&&(!db.settings.autoHarvest||!b||station.decision||station.finishing||!['Fruiting','Between flushes'].includes(b.stage)))return;
  if(m!=='start'&&m!=='harvest')return;

}

function envSummary(b){
  if(!db.sensorReadings.length||!b.loc.length)return [];
  const start=blockInocT(b),end=b.closure?b.closure.t:Date.now(),groups={};
  b.loc.forEach((l,i)=>{const t0=Math.max(start,l.t),t1=Math.min(end,b.loc[i+1]?b.loc[i+1].t:end);if(t1<=t0)return;
    db.sensorReadings.forEach(r=>{if(r.zone===l.room&&r.t>=t0&&r.t<t1){const k=r.m+'|'+r.u;(groups[k]=groups[k]||{m:r.m,u:r.u,v:[],flag:0});if(r.q!=='ok'||isNaN(r.v))groups[k].flag++;else groups[k].v.push(r.v)}})});
  return Object.values(groups).map(g=>({m:g.m,u:g.u,avg:avg(g.v),min:g.v.length?Math.min(...g.v):null,max:g.v.length?Math.max(...g.v):null,n:g.v.length,flag:g.flag}));
}

function makeBatch(o){
  const id=normId(o.id||String(db.settings.nextBatch||1));
  if(!id){toast('Batch number required');return null}if(db.batches[id]){toast('Batch '+id+' already exists');return null}
  if(!o.species){toast('Enter what you are growing');return null}
  const sl=db.spawn.find(x=>x.id===o.spawnLot),sb=o.spawnBag&&db.spawnBags[o.spawnBag],now=dstr(Date.now());
  if(sl&&o.spawnUsed&&!sb)sl.remaining=Math.max(0,(sl.remaining??sl.qty)-o.spawnUsed);
  const bt=db.batches[id]={id,species:o.species,strain:o.strain||'',strainId:o.strainId||'',recipe:o.rc?o.rc.name:'',recipeVer:o.rc?o.rc.version:'',recipeId:o.rc?o.rc.id:'',ingredients:o.ingredients||'',
    spawnLot:sl?sl.id:'',spawnBag:sb?sb.id:'',spawnUsed:o.spawnUsed||(sb&&sl&&sl.bagWeight?sl.bagWeight/1000:null),cultureLot:sl?sl.cultureId:'',
    inocRate:o.inocRate||'',prepDate:o.prepDate||now,sterilDate:o.sterilDate||now,inocDate:o.inocDate||now,cycleId:o.cycleId||'',count:o.count,blockWeight:o.blockWeight??null,
    operator:o.operator||op(),dryWeight:o.dryWeight||null,notes:o.notes||'',created:Date.now(),prePrinted:true};
  if(/^\d+$/.test(id))db.settings.nextBatch=Math.max(+db.settings.nextBatch||1,+id+1);
  if(bt.blockWeight!=null)db.settings.lastBlockW=bt.blockWeight;
  db.settings.batchDefaults=db.settings.batchDefaults||{};db.settings.batchDefaults[bt.species]={n:bt.count,w:bt.blockWeight};
  ensureStrain(bt.species,bt.strain);
  if(sb){sb.batches.push(id);if(sb.stage!=='Used'){sb.stage='Used';sb.stageHist.push({stage:'Used',t:Date.now(),op:op()})}deductSpawn(sb)}
  audit(`Created batch ${id} (${bt.count} × ${bt.species})${sb?' from spawn '+sb.id:''}`);addBlocks(bt);save();toast(`Batch ${id}: ${bt.count} blocks created`);return bt;
}

function makeSpawn(o){

    date:o.date||dstr(Date.now()),cycleId:o.cycleId||'',qty:kg,remaining:kg,bagWeight:w,grain:o.grain||'',notes:o.notes||'',bags:n,created:Date.now()};

/* ================= forecasting ================= */
function measured(S){
  if(MS[S])return MS[S];const st=Object.values(db.blocks).filter(b=>speciesOf(b)===S).map(blockStats),closed=st.filter(s=>s.closed);
  const fN=n=>st.filter(s=>s.byF[n]!=null).map(s=>s.byF[n]);
  return MS[S]={y1:fN(1),y2:fN(2),y3:fN(3),incub:st.map(s=>s.incub).filter(x=>x!=null&&x>0),first:st.map(s=>s.toFirst).filter(x=>x!=null),between:st.flatMap(s=>s.betw),fail:closed.length?[closed.filter(s=>s.failed).length/closed.length*100]:[],failN:closed.length};
}
function param(S,k){
  const L=lead(S);if(!['y1','y2','y3','incub','first','between','fail'].includes(k))return {v:+L[k]||0,m:false,n:0};
  const M=measured(S),ms=M[k]||[],n=k==='fail'?M.failN:ms.length;
  if(db.settings.useMeasured&&ms.length&&n>=(k==='fail'?5:3))return {v:avg(ms),m:true,n,sd:sdev(ms)};
  return {v:+L[k]||0,m:false,n};
}
function orderOcc(o,from,to){const out=[],d0=pdate(o.date);if(!d0)return out;if(!o.recurring){if(d0>=from&&d0<to)out.push(d0);return out}
  const end=Math.min(to,o.until?pdate(o.until)+DAY:to);for(let t=d0;t<end;t+=7*DAY)if(t>=from)out.push(t);return out}
const FC={};
function forecast(S){
  const H=Math.max(1,+db.settings.horizon||12),w0=weekStart(Date.now()),now=Date.now(),t0=today0(),L=lead(S),P={};
  ['incub','first','between','y1','y2','y3','fail'].forEach(k=>P[k]=param(S,k));
  const incub=P.incub.v,first=P.first.v,betw=P.between.v,ys=[P.y1.v,P.y2.v,P.y3.v],fail=Math.min(.95,P.fail.v/100),buf=(+db.settings.buffer||0)/100;
  const weeks=[...Array(H)].map((_,i)=>({ws:w0+i*7*DAY,target:+db.targets[S]||0,normal:0,addl:0,existing:0,planned:0,plan:null,late:false}));
  const bucket=(t,g,f)=>{const i=Math.round((weekStart(t)-w0)/(7*DAY));if(i>=0&&i<H)weeks[i][f]+=g};
  db.orders.filter(o=>o.species===S).forEach(o=>orderOcc(o,w0,w0+H*7*DAY).forEach(t=>bucket(t,+o.grams||0,o.additional?'addl':'normal')));
  weeks.forEach(w=>w.demand=(Math.max(w.target,w.normal)+w.addl)*(1+buf));
  Object.values(db.blocks).filter(b=>speciesOf(b)===S&&b.stage!=='Closed').forEach(b=>{
    const ff=(b.stage==='Inoculated'||b.stage==='Incubating')?1-fail:1;let fl=b.flush,t;
    if(b.stage==='Inoculated'||b.stage==='Incubating')t=Math.max(now,blockInocT(b)+(incub+first)*DAY);
    else if(b.stage==='Fruiting'){const done=sum(blockHarvests(b.id).filter(h=>h.flush===fl).map(h=>h.grams)),rem=Math.max(0,(ys[fl-1]||0)-done);t=done>0?now:Math.max(now,(stageTime(b,'Fruiting')||now)+first*DAY);if(rem>0)bucket(t,rem,'existing');fl++;t+=betw*DAY}
    else t=Math.max(now,(stageTime(b,'Between flushes')||now)+betw*DAY);
    for(;fl<=3;fl++){const y=ys[fl-1]||0;if(y>0)bucket(t,y*ff,'existing');t+=betw*DAY}
  });
  const y1e=(ys[0]||0)*(1-fail),lead1=(incub+first)*DAY,plans=[],flags=[];let stock=sum(db.spawn.filter(s=>s.species===S).map(s=>(s.remaining??s.qty)*1000));
  for(let i=0;i<H;i++){const w=weeks[i],gap=w.demand-w.existing-w.planned;if(gap<=1)continue;
    if(!(y1e>0)){flags.push(`${esc(S)}: no flush-1 yield set, so new blocks can't be planned`);break}
    const blocks=Math.ceil(gap/y1e),inoc=w.ws+2*DAY-lead1;
    if(inoc<t0){w.late=true;flags.push(`${esc(S)}, week of ${fmtDay(w.ws)}: short ${fmtW(gap)} and too late to inoculate (would have needed ${fmtDay(inoc)})`);continue}
    const p={S,week:w.ws,blocks,inoc,prep:inoc-DAY,spawn:inoc-L.spawnDays*DAY,culture:inoc-(+L.spawnDays+ +L.cultureDays)*DAY,spawnG:blocks*L.spawnPer,flags:[]};
    if(p.spawn<t0){if(stock>=p.spawnG)stock-=p.spawnG;else{p.flags.push('not enough spawn in stock and too late to make more');flags.push(`${esc(S)}: inoculating ${blocks} blocks by ${fmtDay(inoc)} needs ${r1(p.spawnG/1000)} kg spawn — only ${r1(stock/1000)} kg unallocated`);stock=0}}
    else if(p.culture<t0&&!db.cultures.some(c=>c.species===S&&c.status!=='Retired')){p.flags.push('no active culture lot');flags.push(`${esc(S)}: spawn must start ${fmtDay(p.spawn)} but there is no active culture lot`)}
    plans.push(p);w.plan=p;let t=w.ws+2*DAY;for(let f=0;f<3;f++){if(ys[f]>0)bucket(t,blocks*ys[f]*(1-fail),'planned');t+=betw*DAY}
  }
  const cv=[P.y1,P.y2,P.y3].filter(p=>p.m&&p.sd!=null&&p.v>0).map(p=>p.sd/p.v),unc=cv.length?avg(cv):.3;
  weeks.forEach(w=>{w.net=w.existing+w.planned-w.demand;w.unc=(w.existing+w.planned)*unc});
  const wk=wkey(now);db.snapshots[wk]=db.snapshots[wk]||{};if(!db.snapshots[wk][S]&&weeks[0]){db.snapshots[wk][S]={expected:weeks[0].existing,demand:weeks[0].demand,t:now};save()}
  return FC[S]={weeks,plans,flags,P,unc,L};
}
function capacityFlags(){
  const cap=+db.settings.capInoc||0;if(!cap)return [];const byW={};
  speciesAll().forEach(S=>(FC[S]||forecast(S)).plans.forEach(p=>{const k=wkey(p.inoc);byW[k]=(byW[k]||0)+p.blocks}));
  return Object.entries(byW).filter(([,n])=>n>cap).map(([k,n])=>`Capacity conflict: ${n} blocks planned for inoculation week of ${fmtDay(pdate(k))} — capacity is ${cap}/week`);
}

function genTasks(){
  const want={},t0=today0();
  speciesAll().forEach(S=>{const f=forecast(S);f.plans.forEach(p=>{const d=dstr(p.inoc),base=`${S}|${d}`;
    if(p.spawn>=t0){want[base+'|culture']={title:`Begin culture work for ${S} (for ${p.blocks} blocks inoculating ${fmtDay(p.inoc)})`,due:p.culture,qty:'',pri:'normal'};
    want[base+'|spawn']={title:`Prepare & inoculate ${r1(p.spawnG/1000)} kg ${S} spawn`,due:p.spawn,qty:r1(p.spawnG/1000)+' kg',pri:'normal'}}
    else want[base+'|spawnstock']={title:`Set aside ${r1(p.spawnG/1000)} kg ${S} spawn from stock`,due:p.prep,qty:r1(p.spawnG/1000)+' kg',pri:'normal'};
    want[base+'|substrate']={title:`Prepare substrate & sterilize ${p.blocks} ${S} blocks`,due:p.prep,qty:p.blocks+' blocks',pri:'high'};
    want[base+'|inoc']={title:`Inoculate ${p.blocks} blocks of ${S}`,due:p.inoc,qty:p.blocks+' blocks',pri:'high'}})});
  Object.values(db.batches).forEach(bt=>{const bl=batchBlocks(bt.id).filter(b=>b.stage==='Inoculated'||b.stage==='Incubating');if(!bl.length)return;
    const ready=pdate(bt.inocDate)+param(bt.species,'incub').v*DAY;if(ready<=t0+2*DAY)want[`fruit|${bt.id}`]={title:`Move batch ${bt.id} (${bl.length} ${bt.species}) into fruiting`,due:ready,qty:bl.length+' blocks',pri:'high'}});
  Object.entries(want).forEach(([key,w])=>{const ex=db.tasks.find(t=>t.key===key);
    if(!ex)db.tasks.push({id:'a'+hashStr(key),key,auto:true,title:w.title,due:Math.max(w.due,0),qty:w.qty,pri:w.pri==='high'?'important':'todo',room:/Inoculate|substrate/i.test(w.title)?'lab':/fruiting/i.test(w.title)?'grow':/culture|spawn/i.test(w.title)?'lab':'',assignee:'',status:'open',created:Date.now(),planDue:w.due,hist:[]});
    else if(ex.auto&&!ex.custom){ex.title=w.title;ex.qty=w.qty;ex.planDue=w.due;if(!ex.resched&&ex.status==='open')ex.due=w.due;if(ex.status==='cancelled'&&ex.autoCancel){ex.status='open';ex.autoCancel=false}}});

/* ================= task board =================

const TIERS=[['urgent','🔴 Do now','Important and needs doing right away'],['important','🟠 Important','Matters, but can be scheduled'],['todo','🟢 To do','Needs doing — not urgent or critical']];
function tierOf(t,eff){const base=t.pri==='urgent'?'urgent':(t.pri==='important'||t.pri==='high')?'important':'todo';return eff&&t.status==='open'&&t.due&&t.due<today0()?'urgent':base}

function taskCard(t){
  const t0=today0(),od=t.due&&t.due<t0,dt=t.due&&t.due>=t0&&t.due<t0+DAY,eff=tierOf(t,true),base=tierOf(t),i=TIERS.findIndex(x=>x[0]===base);

   <div class="small muted" style="margin-top:3px">${[t.room&&ROLES[t.room]?ROLES[t.room].icon+' '+ROLES[t.room].name.split(' ')[0]:'',t.assignee?'👤 '+esc(t.assignee):'',t.qty?esc(t.qty):'',t.auto?'from plan':'',eff!==base?'(moved up — overdue)':''].filter(Boolean).join(' · ')}</div>
   ${t.notes?`<div class="small" style="margin-top:4px">${esc(t.notes)}</div>`:''}

    ${i>0?`<button class="chip" title="More urgent" onclick="taskTier('${t.id}','${TIERS[i-1][0]}')">↑ ${TIERS[i-1][1].split(' ').slice(1).join(' ')}</button>`:''}
    ${i<2?`<button class="chip" title="Less urgent" onclick="taskTier('${t.id}','${TIERS[i+1][0]}')">↓ ${TIERS[i+1][1].split(' ').slice(1).join(' ')}</button>`:''}

function taskSet(id,k,v){const t=db.tasks.find(x=>x.id===id);if(!t)return;t[k]=v;if(k==='status'){t.hist.push({t:Date.now(),msg:`${v==='done'?'Done':v==='open'?'Reopened':v} by ${op()}`});if(v==='done')t.doneT=Date.now();t.autoCancel=false;audit(`Task ${v==='done'?'done':v}: ${t.title}`)}save();render()}

const CYCLE_TYPES={Pasteurize:{methods:['Steam','Hot water bath','Barrel / drum','Oven'],target:60,hold:120},Sterilize:{methods:['Pressure cooker','Autoclave','Atmospheric steam'],target:121,hold:150}};
const tU=()=>db.settings.tempUnit||(db.settings.unit==='lb'?'F':'C');

  const base=own.slice(),near=t=>base.some(r=>Math.abs(r[0]-t)<45e3);probeBetween(c.start-2*6e4,(c.end||Date.now())+2*6e4).forEach(x=>{if(!near(x[0]))own.push(x)});return own.sort((a,b)=>a[0]-b[0])}

  if(tf==null&&s.length>1&&!isNaN(parseStamp(s[0]+' '+s[1]))){tc=1;tf=r=>parseStamp(r[0]+' '+r[1])}

/* ================= purchases (encrypted) =================
   Farm purchases (supplies, equipment, utilities…), locked behind their own long password.
   Every purchase is encrypted in this browser (AES-256-GCM, key from the password with PBKDF2-SHA-256,
   600,000 rounds) before it is saved or synced. The server, backups and other devices only ever hold the
   scrambled data. The password itself is never stored anywhere — a forgotten password cannot be recovered.
   The export is the CSV FreshBooks imports under Expenses → Import: Date, Merchant, Description,
   Category, Amount (MM/DD/YYYY, plain positive numbers). Amounts are kept in whole cents. */
const PU_CATS=['Supplies','Materials','Equipment','Repairs & Maintenance','Utilities','Rent or Lease','Fuel','Shipping & Postage','Advertising','Office Expenses','Professional Services','Insurance','Taxes & Licenses','Other Expenses'];
const PU_PAY=['Card','Cash','Check','Bank transfer','Other'];
const PU_MINLEN=16,PU_ITER=600000,PU_IDLE=10*60000;
let PU={range:'month',from:'',to:'',cat:'',onlyNew:true};
const PV={key:null,plain:{},seen:{},timer:null,busy:false};
const puCats=()=>Array.isArray(db.settings.purchaseCats)&&db.settings.purchaseCats.length?db.settings.purchaseCats:PU_CATS;
const money=c=>'$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const toCents=v=>{const n=Number(String(v).replace(/[$,\s]/g,''));return Number.isFinite(n)&&n>0?Math.round(n*100):null};
const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function puKey(pw,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64d(salt),iterations:iter},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function puEnc(obj,key){const iv=crypto.getRandomValues(new Uint8Array(12));
  return {iv:b64e(iv),ct:b64e(await crypto.subtle.encrypt({name:'AES-GCM',iv},key||PV.key,new TextEncoder().encode(JSON.stringify(obj))))}}
async function puDec(e,key){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},key||PV.key,b64d(e.ct))))}
const puVault=()=>db.settings.puVault&&db.settings.puVault.check?db.settings.puVault:null;
function puLock(){PV.key=null;PV.plain={};PV.seen={};clearTimeout(PV.timer)}
function puTouch(){clearTimeout(PV.timer);if(PV.key)PV.timer=setTimeout(()=>{puLock();if(tab==='purchases')renderPurchases();toast('Purchases locked after 10 minutes idle')},PU_IDLE)}
/* Decrypt anything new or changed (e.g. synced from another device); encrypt any plain leftovers. */
async function puSync(){if(!PV.key||PV.busy)return false;PV.busy=true;let changed=false,wrote=false;
  try{const ids=new Set();for(const r of db.purchases){if(!r||!r.id)continue;ids.add(r.id);
      if(r.enc){if(PV.seen[r.id]!==r.enc.ct){try{PV.plain[r.id]=await puDec(r.enc);PV.seen[r.id]=r.enc.ct;changed=true}catch(e){}}}
      else{const {id,created,...rest}=r;const obj=Object.assign({},rest);r.enc=await puEnc(obj);for(const k of Object.keys(r))if(!['id','created','enc'].includes(k))delete r[k];PV.plain[id]=obj;PV.seen[id]=r.enc.ct;changed=wrote=true}}
    for(const id of Object.keys(PV.plain))if(!ids.has(id)){delete PV.plain[id];delete PV.seen[id];changed=true}

  if(k===' '){const b=hkSpace();if(b)hkPress(b);return}
  if(/^[1-9]$/.test(k)){const b=hkButtons()[+k-1];if(b)hkPress(b);return}
  if($('dlg').open)return;const K=k.toLowerCase();
  if(k==='?')return hkHelp();
  if(K==='/'){$('scanbox').focus();return}
  if(K==='b'&&can('lab'))return openNewBatch();
  if(K==='s'&&can('lab'))return openNewSpawn();
  if(K==='l'&&can('lab'))return openNewCulture();
  if(K==='r'&&can('prep'))return openNewCycle();
  if(K==='p'&&can('lab'))return printerSetup();
  if(K==='t'&&can('harvest')&&tab==='home'&&$('wt')){scale.tare=scale.raw||0;renderHome();return toast('Scale tared')}
  if(K==='a')return activityDialog();
  if(K==='k')return openTaskBoard();
  if(K==='o')return openLibrary();
  if(K==='w')return whoDialog();
  if(K==='m')return chooseRole();
  if(K==='h')return goHome();
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const el=e.target,typing=/INPUT|TEXTAREA|SELECT/.test(el.tagName),now=performance.now();
  if(typing){
    if(e.key==='Enter'&&el.tagName==='INPUT'&&el.id!=='scanbox'&&el.closest('#dlg')){const b=$('dlg').querySelector('.act .btn.xl')||$('dlg').querySelector('.btn.green');if(b&&!/^ic_|^newOp$/.test(el.id)){e.preventDefault();hkPress(b)}}
    if(e.key==='Escape'&&!el.closest('#dlg'))el.blur();
    return}
  if(now-hkLast<80)hkBurst=now+250;hkLast=now;
  if(now<hkBurst){clearTimeout(hkTimer);hkTimer=null;return}
  if(e.key==='Escape'){if($('login').style.display!=='none'){if(LG.step!=='who'&&LG.step!=='room')loginShow('who');return}if(!$('dlg').open&&tab==='home')goHome();return}
  if(e.key===' '&&hkSpace())e.preventDefault();
  if(e.key.length!==1)return;
  const k=e.key;clearTimeout(hkTimer);hkTimer=setTimeout(()=>{hkTimer=null;if(performance.now()<hkBurst)return;runHotkey(k)},90);
},true);

people();syncOps();seedStrains();render();if(!curUser())loginShow();syncStart();
</script>
