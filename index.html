<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fungatory</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#2a2620;--muted:#7a7266;--line:#e3ddd2;--acc:#8a5a2b;--acc2:#3f6b3a;--warn:#b3412e;--chip:#efe9df}
@media (prefers-color-scheme:dark){:root{--bg:#1a1815;--card:#24211d;--ink:#ece6dc;--muted:#a39a8c;--line:#3a352e;--acc:#d39a5c;--acc2:#7fb174;--warn:#e0705c;--chip:#2f2b25}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0 8px 0 0}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--muted);cursor:pointer;font:inherit;position:relative}
nav button.on{background:var(--chip);color:var(--ink);font-weight:600}
.badge{background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:4px}
#scanbox{flex:1;min-width:160px;max-width:280px}
#modebar{padding:8px 16px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--chip);font-size:13px}
.pill.a{background:var(--acc);color:#fff}.pill.g{background:var(--acc2);color:#fff}.pill.r{background:var(--warn);color:#fff}
main{padding:4px 16px 40px;max-width:1200px;margin:auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.card>b:first-child,.card h3{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat b{display:block;font-size:21px}.stat span{color:var(--muted);font-size:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:var(--chip)}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{width:100%;min-height:56px}
label{display:block;margin:6px 0;font-size:12.5px;color:var(--muted)}
label input,label select,label textarea{display:block;width:100%;margin-top:3px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;padding:7px 13px;border-radius:8px}
.btn.alt{background:var(--chip);color:var(--ink)}.btn.green{background:var(--acc2)}.btn.danger{background:var(--warn)}
.btn.big{font-size:18px;padding:12px 20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.muted{color:var(--muted)}.small{font-size:12px}
.weight{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.1}
.stable{color:var(--acc2)}.unstable{color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--chip);border:1px solid transparent;border-radius:99px;padding:4px 10px;font-size:13px;color:var(--ink)}
.chip.on{border-color:var(--acc);font-weight:600}
.alert{border-left:4px solid var(--warn);padding:7px 10px;background:var(--chip);border-radius:6px;margin:6px 0;font-size:13.5px}
.alert.ok{border-color:var(--acc2)}.alert.info{border-color:var(--acc)}
.tag{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.m{background:var(--acc2);color:#fff}
.bad{color:var(--warn);font-weight:600}.good{color:var(--acc2);font-weight:600}
.bigid{font-size:30px;font-weight:700;letter-spacing:.5px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(720px,96vw);max-height:92vh}
dialog::backdrop{background:#0006}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.labels{display:flex;flex-wrap:wrap;gap:8px}
.label{border:1px dashed var(--line);border-radius:6px;display:flex;gap:2mm;align-items:center;background:#fff;color:#000;overflow:hidden}
.label .qr{flex:none}.label b{font-size:14px;display:block;line-height:1.1}.label small{font-size:10px;display:block;line-height:1.2}
#printZone{display:none}
.home{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:0 14px;align-items:start}
@media (max-width:760px){.home{grid-template-columns:1fr}}
.act{display:grid;gap:10px}
.btn.xl{font-size:19px;padding:15px 16px;width:100%;border-radius:12px;font-weight:600}
.btn.xl.alt{font-weight:500}
#moreNav{display:none}#moreNav.open{display:contents}
#modebar:empty{display:none}
@media print{body>*:not(#printZone){display:none!important}#printZone{display:block}#printZone .label{border:0;border-radius:0;margin:0;break-after:page;page-break-after:always}}
</style>
</head>
<body>
<header>
  <h1 style="cursor:pointer" onclick="station.block=null;show('home')">🍄 Fungatory</h1><button id="roleChip" class="chip" onclick="chooseRole()" style="display:none"></button><button id="printerChip" class="chip" onclick="printerSetup()" style="display:none"></button><span id="syncStat" class="small muted" style="cursor:pointer;white-space:nowrap" onclick="syncClick()"></span>
  <nav id="nav">
    <button data-t="home" class="on">Home</button><button id="moreBtn" onclick="toggleMore()">More ▾<span id="taskBadge"></span></button><span id="moreNav"><button data-t="dash">Dashboard</button><button data-t="blocks">Blocks</button><button data-t="batches">Batches</button><button data-t="inventory">Inventory</button><button data-t="planning">Planning</button><button data-t="tasks">Tasks</button><button data-t="labels">Labels</button><button data-t="settings">Settings</button></span>
  </nav>
  <button id="opChip" class="chip" onclick="whoDialog()" title="Who is using this device"></button><button class="chip" onclick="activityDialog()">📋 Activity</button>
  <input id="scanbox" placeholder="Scan or type a block ID…" autocomplete="off">
  <span id="addBtns" style="display:contents"><button class="btn alt" onclick="openNewCulture()">+ Add culture</button><button class="btn alt" onclick="openNewSpawn()">+ Add spawn</button><button class="btn" onclick="openNewBatch()">+ Add batch</button></span>
</header>
<div id="modebar"></div>
<main>
<section id="home" class="on"></section>
<section id="dash"></section>
<section id="blocks"></section>
<section id="batches"></section>
<section id="inventory"></section>
<section id="planning"></section>
<section id="tasks"></section>
<section id="labels"></section>
<section id="settings"></section>
</main>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<div id="printZone"></div>

<script>
/* ================= core ================= */
const STAGES=['Inoculated','Incubating','Fruiting','Between flushes','Closed'];
const REASONS=['Exhausted','Contaminated','Damaged','Removed to free space'];
const DAY=864e5,KEY='fungatory-db-v2',OLDKEY='eureka-grow-db';
const LEAD_DEFAULT={incub:21,first:7,between:12,y1:450,y2:250,y3:110,fail:10,spawnDays:14,cultureDays:14,spawnPer:250};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normId=s=>String(s).trim().toUpperCase().replace(/[^A-Z0-9._-]/g,'');
const hashStr=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dstr=t=>{if(t==null||t==='')return '';const d=new Date(t);if(isNaN(d))return '';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const pdate=s=>{if(!s)return null;const [y,m,d]=String(s).split('-').map(Number);if(!y)return null;return new Date(y,m-1,d||1).getTime()};
const fmtDate=t=>t?new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const fmtDay=t=>t?new Date(t).toLocaleDateString([], {month:'short',day:'numeric'}):'—';
const today0=()=>new Date().setHours(0,0,0,0);
const weekStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()-((d.getDay()+6)%7)*DAY};
const wkey=t=>dstr(weekStart(t));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sdev=a=>{if(a.length<2)return null;const m=avg(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const r1=x=>x==null||isNaN(x)?'—':(Math.round(x*10)/10).toString();
const pct=x=>x==null||isNaN(x)?'—':Math.round(x)+'%';
const sum=a=>a.reduce((x,y)=>x+y,0);

function blank(){return {v:2,settings:{unit:'lb',labelW:50,labelH:30,operators:['Trace'],op:'Trace',rooms:['Lab','Incubation','Fruiting'],nextBatch:1,bagIncluded:true,bagWeight:0,autoStart:true,autoHarvest:true,autoPrint:true,captureMin:200,rearm:30,stableTol:5,stableMs:1000,buffer:10,capInoc:100,horizon:12,useMeasured:true},
  strains:[],cultures:[],cultureJars:{},spawn:[],spawnBags:{},recipes:[],batches:{},blocks:{},harvests:[],targets:{},lead:{},orders:[],tasks:[],snapshots:{},sensorReadings:[],log:[]}}
let db=load();db.log.forEach((l,i)=>{if(!l.id)l.id='l'+hashStr(l.t+'|'+l.msg+'|'+i)});
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.blocks){const b=blank();const out=Object.assign(b,d);out.settings=Object.assign(blank().settings,d.settings||{});return out}}catch(e){}
  try{const o=JSON.parse(localStorage.getItem(OLDKEY));if(o&&o.bags){const m=migrate(o);localStorage.setItem(KEY,JSON.stringify(m));return m}}catch(e){}
  return blank();
}
function migrate(o){
  const d=blank(),map={Inoculated:'Inoculated',Colonizing:'Incubating',Colonized:'Incubating',Fruiting:'Fruiting',Resting:'Between flushes',Spent:'Closed',Contaminated:'Closed'};
  if(o.settings&&o.settings.labelW){d.settings.labelW=o.settings.labelW;d.settings.labelH=o.settings.labelH}
  Object.values(o.bags||{}).forEach(b=>{
    const bid=normId('OLD-'+(b.batch||'X'));
    if(!d.batches[bid])d.batches[bid]={id:bid,species:b.species||'',strain:'',recipe:b.substrate||'',recipeVer:'',ingredients:'',spawnLot:'',inocRate:'',prepDate:'',sterilDate:'',inocDate:dstr(b.created),count:0,operator:'',dryWeight:b.dryWeight||null,notes:'Imported from first version',created:b.created};
    d.batches[bid].count++;
    const st=map[b.status]||'Incubating';
    d.blocks[b.id]={id:b.id,batchId:bid,stage:st,stageHist:(b.history||[]).map(h=>({stage:map[h.s]||h.s,t:h.t,op:''})),loc:[],startWeight:null,finalWeight:null,
      closure:st==='Closed'?{t:Date.now(),reason:b.status==='Contaminated'?'Contaminated':'Exhausted',op:'',notes:'Imported'}:null,flush:1,events:[],contam:b.status==='Contaminated'?[{t:Date.now(),note:'Imported',op:''}]:[],notes:b.notes||'',edits:[],labelPrints:1,created:b.created};
  });
  (o.harvests||[]).forEach(h=>{if(d.blocks[h.bagId])d.harvests.push({id:h.id,blockId:h.bagId,flush:h.flush||1,pick:1,grams:h.grams,t:h.t,op:'',notes:'',edits:[]})});
  Object.values(d.blocks).forEach(b=>{const hs=d.harvests.filter(h=>h.blockId===b.id).sort((a,c)=>a.t-c.t),c={};hs.forEach(h=>{c[h.flush]=(c[h.flush]||0)+1;h.pick=c[h.flush]});if(hs.length)b.flush=Math.max(...hs.map(h=>h.flush))});
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('⚠️ Could not save — export a backup now')}if(SYNC.on)queuePush()}

/* ================= shared sync with the server =================
   Data is split into records (one per block, harvest, batch…). Each device keeps a "shadow" of what the
   server last had, pushes only records it changed, and pulls other devices' changes every few seconds.
   Works offline: unsent changes stay in this browser and go up when the server is reachable again. */
const SYNC={on:false,ver:0,shadow:{},busy:false,again:false,t:null,key:'',state:'',first:false,dirty:false};
const S_MAPS=['batches','blocks','spawnBags','cultureJars','targets','lead','snapshots'],S_LISTS=['harvests','tasks','orders','spawn','cultures','strains','recipes','log'];
function flatten(d){const r={};S_MAPS.forEach(c=>Object.entries(d[c]||{}).forEach(([k,v])=>{r[c+'/'+k]=v}));
  S_LISTS.forEach(c=>(d[c]||[]).forEach(v=>{if(v&&v.id!=null)r[c+'/'+v.id]=v}));
  const st=Object.assign({},d.settings);delete st.op;r['_/settings']=st;r['_/sensorReadings']=d.sensorReadings||[];return r}
function unflatten(r,op){const d=blank();d.settings=Object.assign(blank().settings,r['_/settings']||{});if(op)d.settings.op=op;
  if(r['_/sensorReadings'])d.sensorReadings=r['_/sensorReadings'];
  for(const [k,v] of Object.entries(r)){if(v==null||k.startsWith('_/'))continue;const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);
    if(S_MAPS.includes(c))d[c][id]=v;else if(S_LISTS.includes(c))d[c].push(v)}
  const byT=k=>(a,b)=>(a[k]||0)-(b[k]||0);d.harvests.sort(byT('t'));d.tasks.sort(byT('created'));d.strains.sort(byT('created'));d.log.sort(byT('t'));
  d.spawn.sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  return d}
function syncSaveState(){try{localStorage.setItem('fungatory-sync',JSON.stringify({ver:SYNC.ver,shadow:SYNC.shadow}))}catch(e){}}
function setSync(st){SYNC.state=st;const e=$('syncStat');if(!e)return;
  e.innerHTML={synced:'<span class="good">● Synced</span>',saving:'○ Saving…',offline:'<span class="bad">⚠ Offline — saved here, will sync</span>',key:'<span class="bad">🔒 Enter farm key</span>',local:''}[st]||'';
  e.title={synced:'Shared with every device using this site',offline:'Changes are kept in this browser and sent when the server is reachable',key:'Tap to enter the farm key'}[st]||''}
function syncClick(){if(SYNC.state==='key'){const k=prompt('Farm key (from the server setup)');if(k!=null){SYNC.key=k.trim();try{localStorage.setItem('fungatory-key',SYNC.key)}catch(e){}syncStart()}}else if(SYNC.on)pullNow()}
async function api(method,body,since){
  const o={method,headers:{'X-Farm-Key':SYNC.key||''},cache:'no-store'};if(body){o.headers['content-type']='application/json';o.body=JSON.stringify(body)}
  const r=await fetch('api/sync'+(method==='GET'?'?since='+since:''),o);
  if(r.status===401){const e=new Error('key');e.key=true;throw e}if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e}return r.json()}
function queuePush(){clearTimeout(SYNC.t);SYNC.t=setTimeout(pushNow,400)}
async function pushNow(){
  if(!SYNC.on)return;if(SYNC.busy){SYNC.again=true;return}
  const cur=flatten(db),ch={};let n=0;
  for(const k in cur){const j=JSON.stringify(cur[k]);if(SYNC.shadow[k]!==j){ch[k]=cur[k];n++}}
  for(const k in SYNC.shadow)if(!(k in cur)&&SYNC.shadow[k]!=='null'){ch[k]=null;n++}
  if(!n){if(SYNC.state!=='key')setSync('synced');return}
  SYNC.busy=true;setSync('saving');
  try{await api('POST',{changes:ch});for(const k in ch)SYNC.shadow[k]=JSON.stringify(ch[k]);syncSaveState();setSync('synced')}
  catch(e){setSync(e.key?'key':'offline')}
  finally{SYNC.busy=false;if(SYNC.again){SYNC.again=false;queuePush()}}
}
async function pullNow(){
  if(!SYNC.on||SYNC.busy)return;
  try{const r=await api('GET',null,SYNC.ver),keys=Object.keys(r.changes);let changed=false;
    if(keys.length){const cur=flatten(db);
      for(const k of keys){const v=r.changes[k],j=JSON.stringify(v),local=k in cur?JSON.stringify(cur[k]):'null',sh=SYNC.shadow[k]??'null';
        if(!SYNC.first&&local!==sh&&local!==j)continue;            // this device changed it and hasn't sent it yet — ours wins
        SYNC.shadow[k]=j;if(local!==j){if(v==null)delete cur[k];else cur[k]=v;changed=true}}
      if(changed){db=unflatten(cur,db.settings.op);try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}}
    SYNC.ver=r.version;SYNC.first=false;syncSaveState();
    if(changed||SYNC.dirty)remoteRefresh();
    pushNow();
  }catch(e){setSync(e.key?'key':'offline')}
}
function remoteRefresh(){const a=document.activeElement;if($('dlg').open||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=='scanbox')){SYNC.dirty=true;return}SYNC.dirty=false;render()}
async function syncStart(){
  if(!/^https?:$/.test(location.protocol))return setSync('local');
  try{SYNC.key=localStorage.getItem('fungatory-key')||'';const s=JSON.parse(localStorage.getItem('fungatory-sync')||'null');if(s){SYNC.ver=s.ver||0;SYNC.shadow=s.shadow||{}}}catch(e){}
  try{await api('GET',null,1e15)}catch(e){if(e.key)return setSync('key');if(e.status===404||e.status===405)return setSync('local');SYNC.on=true;setSync('offline');return syncLoop()}
  SYNC.first=!SYNC.ver&&!Object.keys(SYNC.shadow).length;SYNC.on=true;await pullNow();syncLoop();
}
let syncLoopOn=false;
function syncLoop(){if(syncLoopOn)return;syncLoopOn=true;setInterval(pullNow,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullNow()});window.addEventListener('online',pullNow)}
function audit(msg){db.log.push({id:uid(),t:Date.now(),op:op(),room:ROLE||'',msg});if(db.log.length>3000)db.log.splice(0,db.log.length-3000)}
const op=()=>db.settings.op||'';
const U=()=>db.settings.unit==='lb'?'lb':'g';
function fmtW(g){if(g==null||isNaN(g))return '—';return db.settings.unit==='lb'?(g/453.592).toFixed(2)+' lb':(Math.abs(g)>=1000?(g/1000).toFixed(2)+' kg':Math.round(g)+' g')}
const wIn=v=>db.settings.unit==='lb'?v*453.592:v;
const wOut=g=>g==null?'':db.settings.unit==='lb'?+(g/453.592).toFixed(2):Math.round(g);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)}
function beep(f=660){try{const a=beep.c||(beep.c=new AudioContext()),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function ok(){beep(880);setTimeout(()=>beep(1100),140)}
function dlg(html){$('dlg').innerHTML=html;if(!$('dlg').open)$('dlg').showModal()}
function closeDlg(){$('dlg').close()}

/* ================= helpers ================= */
const liveHarvests=()=>db.harvests.filter(h=>!h.void);
const blockHarvests=id=>liveHarvests().filter(h=>h.blockId===id);
const batchOf=b=>db.batches[b.batchId]||{};
const speciesOf=b=>batchOf(b).species||'Unknown';
function setStage(b,s){if(b.stage===s)return;b.stage=s;b.stageHist.push({stage:s,t:Date.now(),op:op()});audit(`${b.id} → ${s}`)}
function stageTime(b,s){for(let i=b.stageHist.length-1;i>=0;i--)if(b.stageHist[i].stage===s)return b.stageHist[i].t;return null}
const curLoc=b=>b.loc[b.loc.length-1];
const locStr=l=>l?[l.room,l.rack&&'Rack '+l.rack,l.shelf&&'Shelf '+l.shelf].filter(Boolean).join(' · '):'No location';
function moveLoc(b,str){const [room,rack,shelf]=String(str).split('/').map(s=>(s||'').trim());b.loc.push({room,rack:rack||'',shelf:shelf||'',t:Date.now(),op:op()});audit(`${b.id} moved to ${str}`)}
function roomAt(b,t){let r=null;for(const l of b.loc){if(l.t<=t)r=l.room}return r||(b.loc[0]&&b.loc[0].room)||null}
function blockInocT(b){return pdate(batchOf(b).inocDate)||(b.stageHist[0]&&b.stageHist[0].t)||b.created}
function blockStats(b){
  const hs=blockHarvests(b.id),inocT=blockInocT(b),tot=sum(hs.map(h=>h.grams)),byF={},fp={};
  hs.forEach(h=>{byF[h.flush]=(byF[h.flush]||0)+h.grams;if(!fp[h.flush]||h.t<fp[h.flush])fp[h.flush]=h.t});
  const fs=Object.keys(byF).map(Number).sort((a,c)=>a-c),firstT=fs.length?fp[fs[0]]:null,betw=[];
  for(let i=1;i<fs.length;i++)betw.push((fp[fs[i]]-fp[fs[i-1]])/DAY);
  const fr=b.stageHist.find(x=>x.stage==='Fruiting'),end=b.closure?b.closure.t:Date.now();

function handleScan(raw){
  const code=raw.trim();
  if(/^ACT:/i.test(code)){
    const p=code.split(':'),a=(p[1]||'').toUpperCase(),arg=p.slice(2).join(':');beep(520);

    else if(a==='LOC')setMode('loc',arg);

    return;

}

/* Stability = weight hasn't moved more than the tolerance for N ms. Time-based, so scales that only
   send a reading when the value changes (or send slowly) still settle. A device's own stable/unstable flag wins. */
function setWeight(g,dev){const tol=+db.settings.stableTol||5;if(lastVal==null||Math.abs(g-lastVal)>tol){lastVal=g;lastChange=Date.now()}
  scale.raw=g;scale.lastT=Date.now();scale.dev=dev;evalStable()}
function evalStable(){if(scale.raw==null)return;const quiet=Date.now()-lastChange>=(+db.settings.stableMs||1000);
  scale.stable=scale.dev===false?false:scale.dev===true?true:quiet;updateWeight();autoCheck()}
setInterval(evalStable,250);
const fresh=()=>scale.raw!=null&&scale.label!=='Disconnected';
const net=()=>scale.raw==null||!fresh()?null:scale.raw-scale.tare;
function updateWeight(){document.querySelectorAll('.wlive').forEach(e=>e.textContent=W());const w=$('wt');if(!w)return;const g=net();w.textContent=g==null?'—':fmtW(g);w.className='weight '+(scale.stable?'stable':'unstable');
  $('wst').textContent=scale.raw==null?'':!fresh()?'⚠ scale disconnected':scale.stable?(armed?'● stable':'● stable — lift off to re-arm'):'○ settling…'}
function connLabel(l){scale.label=l;if(tab==='home'&&$('home').innerHTML)renderHome();else{const e=$('conn');if(e)e.textContent=l}}
/* Scale connects over USB HID (standard POS-scale report: status, unit, exponent, weight LSB/MSB).
   Once permission is granted, Chrome remembers it, so the scale reconnects by itself on load and when re-plugged. */
let hidDev=null;
function hex(dv){return [...new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength)].map(x=>x.toString(16).padStart(2,'0')).join(' ')}
async function attachHID(d){
  try{if(!d.opened)await d.open();hidDev=d;connLabel('Scale: '+(d.productName||'USB scale'));
    d.oninputreport=e=>{const v=e.data;scale.lastLine=`report ${e.reportId}: ${hex(v)}`;const ll=$('rawline');if(ll)ll.textContent='Last data: '+scale.lastLine;
      if(v.byteLength<5)return;const st=v.getUint8(0),unit=v.getUint8(1),exp=v.getInt8(2),raw=v.getUint16(3,true);
      let val=raw*Math.pow(10,exp);const u={2:'g',3:'kg',11:'oz',12:'lb'}[unit]||'g';if(st===5)val=-val;if(st===2)val=0;
      setWeight(val*UNITS[u],st===4||st===2?true:st===3?false:undefined)};
  }catch(e){toast('Scale: '+e.message)}
}
async function connectHID(){
  if(!('hid' in navigator))return toast('Connecting a scale needs Chrome or Edge on a computer (not inside the claude.ai viewer)');
  try{const [d]=await navigator.hid.requestDevice({filters:[]});if(d)await attachHID(d)}catch(e){toast('Scale: '+e.message)}
}
if('hid' in navigator){
  navigator.hid.getDevices().then(ds=>{if(ds[0])attachHID(ds[0])}).catch(()=>{});
  navigator.hid.addEventListener('connect',e=>{if(!hidDev||e.device===hidDev||!hidDev.opened){attachHID(e.device);toast('Scale reconnected')}});
  navigator.hid.addEventListener('disconnect',e=>{if(e.device===hidDev){hidDev=null;connLabel('Disconnected');toast('Scale unplugged')}});
}

function autoCheck(){
  const g=net();if(g==null)return;
  if(g<(+db.settings.rearm||30)){armed=true;stableSince=0;return}
  if(!can('harvest')){stableSince=0;return}
  if(!armed||!scale.stable||tab!=='home'||$('dlg').open){if(!scale.stable)stableSince=0;return}
  const m=mode.type,b=db.blocks[station.block],bt=db.batches[station.batch];
  if(m==='start'&&(!db.settings.autoStart||!bt||!nextStartTarget(bt)||g<(+db.settings.captureMin||0)))return;
  if(m==='harvest'&&(!db.settings.autoHarvest||!b||station.decision||station.finishing||!['Fruiting','Between flushes'].includes(b.stage)))return;
  if(m!=='start'&&m!=='harvest')return;
  if(!stableSince)stableSince=Date.now();
  if(Date.now()-stableSince>1500){armed=false;stableSince=0;stationRecord(g)}
}
function stationRecord(g){g=g??net();if(mode.type==='start')return captureStart(g);if(mode.type==='harvest')return recordHarvest(g)}

function envSummary(b){
  if(!db.sensorReadings.length||!b.loc.length)return [];
  const start=blockInocT(b),end=b.closure?b.closure.t:Date.now(),groups={};
  b.loc.forEach((l,i)=>{const t0=Math.max(start,l.t),t1=Math.min(end,b.loc[i+1]?b.loc[i+1].t:end);if(t1<=t0)return;
    db.sensorReadings.forEach(r=>{if(r.zone===l.room&&r.t>=t0&&r.t<t1){const k=r.m+'|'+r.u;(groups[k]=groups[k]||{m:r.m,u:r.u,v:[],flag:0});if(r.q!=='ok'||isNaN(r.v))groups[k].flag++;else groups[k].v.push(r.v)}})});
  return Object.values(groups).map(g=>({m:g.m,u:g.u,avg:avg(g.v),min:g.v.length?Math.min(...g.v):null,max:g.v.length?Math.max(...g.v):null,n:g.v.length,flag:g.flag}));
}

function makeBatch(o){

    inocRate:o.inocRate||'',prepDate:o.prepDate||now,sterilDate:o.sterilDate||now,inocDate:o.inocDate||now,count:o.count,blockWeight:o.blockWeight??null,

    return {k,n:st.length,closed:closed.length,tot:sum(tots),avg:avg(tots),sd:sdev(tots),succ:avg(succ.map(s=>s.tot)),succN:succ.length,f1:f(1),f2:f(2),f3:f(3),later:sum(tots)?late/sum(tots)*100:null,
      dtf:avg(st.map(s=>s.dtf).filter(x=>x!=null)),betw:avg(st.flatMap(s=>s.betw)),cycle:avg(closed.map(s=>s.cycle)),contam:st.filter(s=>s.contam).length/st.length*100,fail:closed.length?closed.filter(s=>s.failed).length/closed.length*100:null,

function allAlerts(fc){
  const a=[],t0=today0();
  db.tasks.filter(t=>t.status==='open'&&t.due<t0).forEach(t=>a.push({msg:`Overdue (${fmtDay(t.due)}): ${esc(t.title)}`}));
  db.tasks.filter(t=>t.status==='open'&&t.due>=t0&&t.due<t0+DAY).forEach(t=>a.push({lvl:'info',msg:`Due today: ${esc(t.title)}`}));
  (fc||speciesAll().map(S=>({S,f:forecast(S)}))).forEach(({f})=>f.flags.forEach(m=>a.push({msg:m})));
  capacityFlags().forEach(m=>a.push({msg:m}));
  return a;
}

/* ================= forecasting ================= */
function measured(S){
  if(MS[S])return MS[S];const st=Object.values(db.blocks).filter(b=>speciesOf(b)===S).map(blockStats),closed=st.filter(s=>s.closed);
  const fN=n=>st.filter(s=>s.byF[n]!=null).map(s=>s.byF[n]);
  return MS[S]={y1:fN(1),y2:fN(2),y3:fN(3),incub:st.map(s=>s.incub).filter(x=>x!=null&&x>0),first:st.map(s=>s.toFirst).filter(x=>x!=null),between:st.flatMap(s=>s.betw),fail:closed.length?[closed.filter(s=>s.failed).length/closed.length*100]:[],failN:closed.length};
}
function param(S,k){
  const L=lead(S);if(!['y1','y2','y3','incub','first','between','fail'].includes(k))return {v:+L[k]||0,m:false,n:0};
  const M=measured(S),ms=M[k]||[],n=k==='fail'?M.failN:ms.length;
  if(db.settings.useMeasured&&ms.length&&n>=(k==='fail'?5:3))return {v:avg(ms),m:true,n,sd:sdev(ms)};
  return {v:+L[k]||0,m:false,n};
}
function orderOcc(o,from,to){const out=[],d0=pdate(o.date);if(!d0)return out;if(!o.recurring){if(d0>=from&&d0<to)out.push(d0);return out}
  const end=Math.min(to,o.until?pdate(o.until)+DAY:to);for(let t=d0;t<end;t+=7*DAY)if(t>=from)out.push(t);return out}
const FC={};
function forecast(S){
  const H=Math.max(1,+db.settings.horizon||12),w0=weekStart(Date.now()),now=Date.now(),t0=today0(),L=lead(S),P={};
  ['incub','first','between','y1','y2','y3','fail'].forEach(k=>P[k]=param(S,k));
  const incub=P.incub.v,first=P.first.v,betw=P.between.v,ys=[P.y1.v,P.y2.v,P.y3.v],fail=Math.min(.95,P.fail.v/100),buf=(+db.settings.buffer||0)/100;
  const weeks=[...Array(H)].map((_,i)=>({ws:w0+i*7*DAY,target:+db.targets[S]||0,normal:0,addl:0,existing:0,planned:0,plan:null,late:false}));
  const bucket=(t,g,f)=>{const i=Math.round((weekStart(t)-w0)/(7*DAY));if(i>=0&&i<H)weeks[i][f]+=g};
  db.orders.filter(o=>o.species===S).forEach(o=>orderOcc(o,w0,w0+H*7*DAY).forEach(t=>bucket(t,+o.grams||0,o.additional?'addl':'normal')));
  weeks.forEach(w=>w.demand=(Math.max(w.target,w.normal)+w.addl)*(1+buf));
  Object.values(db.blocks).filter(b=>speciesOf(b)===S&&b.stage!=='Closed').forEach(b=>{
    const ff=(b.stage==='Inoculated'||b.stage==='Incubating')?1-fail:1;let fl=b.flush,t;
    if(b.stage==='Inoculated'||b.stage==='Incubating')t=Math.max(now,blockInocT(b)+(incub+first)*DAY);
    else if(b.stage==='Fruiting'){const done=sum(blockHarvests(b.id).filter(h=>h.flush===fl).map(h=>h.grams)),rem=Math.max(0,(ys[fl-1]||0)-done);t=done>0?now:Math.max(now,(stageTime(b,'Fruiting')||now)+first*DAY);if(rem>0)bucket(t,rem,'existing');fl++;t+=betw*DAY}
    else t=Math.max(now,(stageTime(b,'Between flushes')||now)+betw*DAY);
    for(;fl<=3;fl++){const y=ys[fl-1]||0;if(y>0)bucket(t,y*ff,'existing');t+=betw*DAY}
  });
  const y1e=(ys[0]||0)*(1-fail),lead1=(incub+first)*DAY,plans=[],flags=[];let stock=sum(db.spawn.filter(s=>s.species===S).map(s=>(s.remaining??s.qty)*1000));
  for(let i=0;i<H;i++){const w=weeks[i],gap=w.demand-w.existing-w.planned;if(gap<=1)continue;
    if(!(y1e>0)){flags.push(`${esc(S)}: no flush-1 yield set, so new blocks can't be planned`);break}
    const blocks=Math.ceil(gap/y1e),inoc=w.ws+2*DAY-lead1;
    if(inoc<t0){w.late=true;flags.push(`${esc(S)}, week of ${fmtDay(w.ws)}: short ${fmtW(gap)} and too late to inoculate (would have needed ${fmtDay(inoc)})`);continue}
    const p={S,week:w.ws,blocks,inoc,prep:inoc-DAY,spawn:inoc-L.spawnDays*DAY,culture:inoc-(+L.spawnDays+ +L.cultureDays)*DAY,spawnG:blocks*L.spawnPer,flags:[]};
    if(p.spawn<t0){if(stock>=p.spawnG)stock-=p.spawnG;else{p.flags.push('not enough spawn in stock and too late to make more');flags.push(`${esc(S)}: inoculating ${blocks} blocks by ${fmtDay(inoc)} needs ${r1(p.spawnG/1000)} kg spawn — only ${r1(stock/1000)} kg unallocated`);stock=0}}
    else if(p.culture<t0&&!db.cultures.some(c=>c.species===S&&c.status!=='Retired')){p.flags.push('no active culture lot');flags.push(`${esc(S)}: spawn must start ${fmtDay(p.spawn)} but there is no active culture lot`)}
    plans.push(p);w.plan=p;let t=w.ws+2*DAY;for(let f=0;f<3;f++){if(ys[f]>0)bucket(t,blocks*ys[f]*(1-fail),'planned');t+=betw*DAY}
  }
  const cv=[P.y1,P.y2,P.y3].filter(p=>p.m&&p.sd!=null&&p.v>0).map(p=>p.sd/p.v),unc=cv.length?avg(cv):.3;
  weeks.forEach(w=>{w.net=w.existing+w.planned-w.demand;w.unc=(w.existing+w.planned)*unc});
  const wk=wkey(now);db.snapshots[wk]=db.snapshots[wk]||{};if(!db.snapshots[wk][S]&&weeks[0]){db.snapshots[wk][S]={expected:weeks[0].existing,demand:weeks[0].demand,t:now};save()}
  return FC[S]={weeks,plans,flags,P,unc,L};
}
function capacityFlags(){
  const cap=+db.settings.capInoc||0;if(!cap)return [];const byW={};
  speciesAll().forEach(S=>(FC[S]||forecast(S)).plans.forEach(p=>{const k=wkey(p.inoc);byW[k]=(byW[k]||0)+p.blocks}));
  return Object.entries(byW).filter(([,n])=>n>cap).map(([k,n])=>`Capacity conflict: ${n} blocks planned for inoculation week of ${fmtDay(pdate(k))} — capacity is ${cap}/week`);
}

/* ================= tasks ================= */
function genTasks(){
  const want={},t0=today0();
  speciesAll().forEach(S=>{const f=forecast(S);f.plans.forEach(p=>{const d=dstr(p.inoc),base=`${S}|${d}`;
    if(p.spawn>=t0){want[base+'|culture']={title:`Begin culture work for ${S} (for ${p.blocks} blocks inoculating ${fmtDay(p.inoc)})`,due:p.culture,qty:'',pri:'normal'};
    want[base+'|spawn']={title:`Prepare & inoculate ${r1(p.spawnG/1000)} kg ${S} spawn`,due:p.spawn,qty:r1(p.spawnG/1000)+' kg',pri:'normal'}}
    else want[base+'|spawnstock']={title:`Set aside ${r1(p.spawnG/1000)} kg ${S} spawn from stock`,due:p.prep,qty:r1(p.spawnG/1000)+' kg',pri:'normal'};
    want[base+'|substrate']={title:`Prepare substrate & sterilize ${p.blocks} ${S} blocks`,due:p.prep,qty:p.blocks+' blocks',pri:'high'};
    want[base+'|inoc']={title:`Inoculate ${p.blocks} blocks of ${S}`,due:p.inoc,qty:p.blocks+' blocks',pri:'high'}})});
  Object.values(db.batches).forEach(bt=>{const bl=batchBlocks(bt.id).filter(b=>b.stage==='Inoculated'||b.stage==='Incubating');if(!bl.length)return;
    const ready=pdate(bt.inocDate)+param(bt.species,'incub').v*DAY;if(ready<=t0+2*DAY)want[`fruit|${bt.id}`]={title:`Move batch ${bt.id} (${bl.length} ${bt.species}) into fruiting`,due:ready,qty:bl.length+' blocks',pri:'high'}});
  Object.entries(want).forEach(([key,w])=>{const ex=db.tasks.find(t=>t.key===key);
    if(!ex)db.tasks.push({id:'a'+hashStr(key),key,auto:true,title:w.title,due:Math.max(w.due,0),qty:w.qty,pri:w.pri,assignee:'',status:'open',created:Date.now(),planDue:w.due,hist:[]});
    else if(ex.auto){ex.title=w.title;ex.qty=w.qty;ex.planDue=w.due;if(!ex.resched&&ex.status==='open')ex.due=w.due;if(ex.status==='cancelled'&&ex.autoCancel){ex.status='open';ex.autoCancel=false}}});

async function phConnect(pick,all){

  if(navigator.bluetooth.getAvailability&&!(await navigator.bluetooth.getAvailability()))throw new Error('Bluetooth is off or unavailable on this computer');

      :{filters:['M','Q','P','D','T','Phomemo','Mr'].map(n=>({namePrefix:n})).concat([{services:[0xff00]},{services:[0xaf30]},{services:[0xae30]}]),optionalServices:PH_SERVICES});
    phLog('Picked: '+(PH.dev.name||'(no name)'));

      const nc=cs.find(x=>String(x.uuid).includes('ff03')&&(x.properties.notify||x.properties.indicate))||cs.find(x=>x.properties.notify||x.properties.indicate);

/* Windows drops Bluetooth packets that are sent too fast without confirmation, which makes the printer
   feed a blank label. "Safe" mode waits for the printer to confirm every chunk. */
async function phWrite(bytes){
  const c=PH.ch,safe=(db.settings.phSend||'safe')==='safe';
  const confirmOk=c.properties.write&&c.writeValueWithResponse,fast=c.properties.writeWithoutResponse&&c.writeValueWithoutResponse;
  const size=safe?Math.min(PH.chunk,100):PH.chunk,t0=Date.now();
  for(let i=0;i<bytes.length;i+=size){const part=bytes.slice(i,i+size);
    if(safe&&confirmOk)await c.writeValueWithResponse(part);
    else if(fast){await c.writeValueWithoutResponse(part);await sleep(safe?40:15)}
    else await c.writeValue(part)}
  phLog(`Sent ${bytes.length} bytes in ${Math.ceil(bytes.length/size)} chunks (${safe?(confirmOk?'confirmed':'slow'):'fast'}) in ${((Date.now()-t0)/1000).toFixed(1)}s`);
}

async function labelBitmap(it){

  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');

    const qc=tmp.querySelector('canvas');if(qc)g.drawImage(qc,m,Math.round((H-q)/2),q,q)}

  const fit=(t,size,bold,min)=>{let f=size;do{font(f,bold);if(g.measureText(t).width<=maxW)break;f--}while(f>(min||10));return f};
  const tf=fit(it.title,Math.round(H*0.2),true);y+=tf;g.fillText(it.title,x,y);
  (it.lines||[]).forEach(l=>{if(!l)return;const L=typeof l==='string'?{t:l,s:0.11}:l,size=Math.round(H*L.s);
    let f=fit(L.t,size,L.b,L.wrap?Math.round(size*0.75):10),rows=[L.t];
    if(L.wrap&&g.measureText(L.t).width>maxW){const words=L.t.split(' ');f=size;
      const wrapAt=sz=>{font(sz,L.b);const rs=[''];words.forEach(w=>{const tr=rs[rs.length-1]?rs[rs.length-1]+' '+w:w;if(g.measureText(tr).width<=maxW||!rs[rs.length-1])rs[rs.length-1]=tr;else rs.push(w)});return rs};
      rows=wrapAt(f);while((rows.length>2||rows.some(r=>g.measureText(r).width>maxW))&&f>12){f--;rows=wrapAt(f)}rows=rows.slice(0,2);font(f,L.b)}

  if(!labelSel)labelSel=bts[0]?'batch:'+bts[0].id:'actions';
  const items=labelItemsFor(labelSel);
  $('labels').innerHTML=`<div class="row"><select onchange="labelSel=this.value;renderLabels()">${bts.map(b=>`<option value="batch:${b.id}" ${labelSel==='batch:'+b.id?'selected':''}>Batch ${esc(b.id)} — ${esc(b.species)}</option>`).join('')}${db.spawn.filter(l=>Object.values(db.spawnBags).some(b=>b.lotId===l.id)).slice().reverse().map(l=>`<option value="spawn:${esc(l.id)}" ${labelSel==='spawn:'+l.id?'selected':''}>Spawn ${esc(l.id)} — ${esc(l.species)}</option>`).join('')}${db.cultures.filter(c=>Object.values(db.cultureJars).some(j=>j.lotId===c.id)).slice().reverse().map(c=>`<option value="culture:${esc(c.id)}" ${labelSel==='culture:'+c.id?'selected':''}>Culture ${esc(c.id)} — ${esc(c.species)}</option>`).join('')}<option value="actions" ${labelSel==='actions'?'selected':''}>Scanner action cards</option><option value="locations" ${labelSel==='locations'?'selected':''}>Location labels</option></select>
   <button class="btn" onclick="${labelSel.startsWith('batch:')?`printBlocks(batchBlocks('${labelSel.slice(6)}').map(b=>b.id),true)`:`printItems(labelItemsFor(labelSel))`}">Print ${items.length}</button></div>
   ${labelSel==='locations'?`<div class="row"><span class="muted small">Racks per room</span><input id="lr" type="number" min="0" value="0" style="width:70px" onchange="renderLabels()"><span class="muted small">Shelves per rack</span><input id="ls" type="number" min="0" value="0" style="width:70px" onchange="renderLabels()"><span class="small muted">Rooms come from Settings.</span></div>`:''}
   <div class="row"><span class="muted small">Label size (mm):</span><input type="number" value="${LW}" style="width:70px" onchange="db.settings.labelW=+this.value;save();renderLabels()"> × <input type="number" value="${LH}" style="width:70px" onchange="db.settings.labelH=+this.value;save();renderLabels()">
   ${[[50,30],[40,30],[60,40],[50,25],[76,51]].map(([w,h])=>`<button class="chip" onclick="db.settings.labelW=${w};db.settings.labelH=${h};save();renderLabels()">${w}×${h}</button>`).join('')}</div>
   <div class="row"><button class="chip" onclick="printerSetup()">🖨 Printer setup — ${PRINTER==='bt'?'Phomemo Bluetooth':'print dialog'}</button></div>
   <p class="small muted">Reprints always reuse the block's existing ID. Block labels show the QR code, ID, species/strain and inoculation date.</p>
   <div id="labelPreview" class="labels">${items.map(labelHTML).join('')||'<p class="muted">No labels for this selection.</p>'}</div>`;
  setPageCSS();renderQR($('labelPreview'));
}

/* ================= settings & data ================= */
function chk(k,l){return `<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto" ${db.settings[k]?'checked':''} onchange="db.settings.${k}=this.checked;save()"> ${l}</label>`}
function num(k,l,step){return `<label>${l}<input type="number" step="${step||'any'}" value="${db.settings[k]}" onchange="db.settings.${k}=+this.value;save()"></label>`}
function renderSettings(){
  $('settings').innerHTML=`<div class="card"><b>Operators &amp; locations</b><div class="two">
   <label>Operators (comma separated)<input value="${esc(db.settings.operators.join(', '))}" onchange="db.settings.operators=this.value.split(',').map(s=>s.trim()).filter(Boolean);if(!db.settings.operators.includes(db.settings.op))db.settings.op=db.settings.operators[0]||'';save();render()"></label>
   <label>Rooms (comma separated)<input value="${esc(db.settings.rooms.join(', '))}" onchange="db.settings.rooms=this.value.split(',').map(s=>s.trim()).filter(Boolean);save()"></label></div></div>
  <div class="card"><b>Weighing</b><p class="small muted">${hidDev?`Connected scale: <b>${esc(hidDev.productName||'USB scale')}</b> — vendor ID <code>${hidDev.vendorId}</code>, product ID <code>${hidDev.productId}</code> (needed for no-click auto-connect)`:'No scale connected.'}</p><div class="two">
   <label>Display units<select onchange="db.settings.unit=this.value;save()"><option value="lb" ${db.settings.unit==='lb'?'selected':''}>pounds</option><option value="g" ${db.settings.unit==='g'?'selected':''}>grams / kg</option></select></label>
   ${num('rearm','Re-arm when scale drops below (g)')}${num('bagWeight','Empty bag weight (g)')}${num('stableTol','Stable when weight changes less than (g)')}${num('stableMs','…for this long (ms)',50)}</div>
   ${chk('bagIncluded','Starting and final block weights include the bag (bag weight is subtracted for yield %)')}
   ${chk('autoHarvest','Auto-record harvest weights when stable')}</div>
  <div class="card"><b>Planning</b><div class="two">${num('buffer','Demand buffer (%)')}${num('capInoc','Inoculation / sterilization capacity (blocks per week)')}${num('horizon','Forecast horizon (weeks)',1)}</div>
   ${chk('useMeasured','Use measured historical performance once enough data exists')}</div>
  <div class="card"><b>Data</b><p class="muted small">${SYNC.on?`Shared through the server — every device on this site sees the same data, and the server keeps a daily backup. ${SYNC.state==='offline'?'<b>Currently offline</b> — changes are saved here and will sync.':''}`:'Stored only in this browser. Open Fungatory from your website to share data between devices.'}</p>
   ${SYNC.on||SYNC.state==='key'?`<div class="row"><label style="margin:0">Farm key<input type="password" value="${esc(SYNC.key)}" style="width:200px" onchange="SYNC.key=this.value.trim();try{localStorage.setItem('fungatory-key',SYNC.key)}catch(e){};syncStart()"></label><button class="btn alt" onclick="pullNow()">Sync now</button></div>`:''}
   <div class="row"><button class="btn" onclick="dl('fungatory-backup-'+dstr(Date.now())+'.json',JSON.stringify(db),'application/json')">Export backup (JSON)</button>
   <button class="btn alt" onclick="exportHarvests()">Harvests CSV</button><button class="btn alt" onclick="exportBlocks()">Blocks CSV</button>
   <label class="btn alt" style="margin:0;color:var(--ink)">Import backup<input type="file" accept=".json" style="display:none" onchange="importJSON(this.files[0])"></label>
   <button class="btn danger" onclick="if(confirm(SYNC.on?'Erase ALL data on EVERY device? Export a backup first.':'Erase ALL data? Export a backup first.')){db=blank();save();render()}">Erase all</button></div></div>
  <div class="card"><b>Environmental sensors</b><p class="small muted">Import readings as CSV with columns: <code>timestamp,sensor_id,zone,measurement,value,unit,quality</code> (zone = room name). Readings are linked to blocks through their location history and shown on each block record. ${db.sensorReadings.length} readings stored.</p>
   <div class="row"><label class="btn alt" style="margin:0;color:var(--ink)">Import sensor CSV<input type="file" accept=".csv,text/csv" style="display:none" onchange="importSensors(this.files[0])"></label>${db.sensorReadings.length?`<button class="btn alt" onclick="if(confirm('Delete all sensor readings?')){db.sensorReadings=[];save();renderSettings()}">Clear readings</button>`:''}</div></div>
  <div class="card"><b>Activity log</b><table>${db.log.slice(-25).reverse().map(l=>`<tr><td class="muted small" style="white-space:nowrap">${fmtDate(l.t)}</td><td class="small">${esc(l.op)}</td><td class="small">${esc(l.msg)}</td></tr>`).join('')}</table></div>`;
}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
const csv=rows=>rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
function exportHarvests(){dl('harvests.csv',csv([['block','batch','species','strain','recipe','flush','pick','net_grams','timestamp','operator','notes','void','edits']].concat(db.harvests.map(h=>{const b=db.blocks[h.blockId]||{},bt=db.batches[b.batchId]||{};return [h.blockId,b.batchId,bt.species,bt.strain,bt.recipe?bt.recipe+' v'+bt.recipeVer:'',h.flush,h.pick,h.grams,new Date(h.t).toISOString(),h.op,h.notes,h.void?'yes':'',h.edits.length]}))),'text/csv')}
function exportBlocks(){dl('blocks.csv',csv([['block','batch','species','strain','recipe','spawn_lot','culture_lot','stage','inoculated','start_g','final_g','closed','reason','harvest_total_g','flushes','days_to_first','contaminated','location']].concat(Object.values(db.blocks).map(b=>{const bt=batchOf(b),s=blockStats(b);return [b.id,b.batchId,bt.species,bt.strain,bt.recipe?bt.recipe+' v'+bt.recipeVer:'',bt.spawnLot,bt.cultureLot,b.stage,dstr(s.inocT),b.startWeight,b.finalWeight,b.closure?dstr(b.closure.t):'',b.closure?b.closure.reason:'',s.tot,Object.keys(s.byF).length,r1(s.dtf),s.contam?'yes':'',locStr(curLoc(b))]}))),'text/csv')}
function importJSON(f){if(!f)return;f.text().then(t=>{const d=JSON.parse(t);let n;if(d.blocks)n=Object.assign(blank(),d);else if(d.bags)n=migrate(d);else throw 0;n.settings=Object.assign(blank().settings,n.settings||{});
  if(confirm('Replace current data with this backup?')){db=n;save();render();toast('Backup restored')}}).catch(()=>toast('Not a valid backup file'))}
function importSensors(f){if(!f)return;f.text().then(t=>{const lines=t.trim().split(/\r?\n/),hdr=lines[0].toLowerCase().split(',').map(s=>s.trim()),ix=k=>hdr.indexOf(k);let n=0;
  const has=ix('timestamp')>=0;(has?lines.slice(1):lines).forEach(l=>{const c=l.split(',').map(s=>s.trim().replace(/^"|"$/g,'')),g=(k,i)=>c[has?ix(k):i];const ts=Date.parse(g('timestamp',0));
    const v=parseFloat(g('value',4));db.sensorReadings.push({t:ts,sensor:g('sensor_id',1),zone:g('zone',2),m:g('measurement',3),v,u:g('unit',5)||'',q:isNaN(ts)||isNaN(v)?'invalid':(g('quality',6)||'ok').toLowerCase()});n++});
  db.sensorReadings.sort((a,c)=>a.t-c.t);save();renderSettings();toast(`Imported ${n} readings`)}).catch(()=>toast('Could not read that CSV'))}

seedStrains();render();syncStart();
</script>
</body>
</html>
